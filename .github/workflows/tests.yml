name: tests
on: [push, pull_request]
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python app/sync_html_engine.py
      - run: python -m unittest discover -s tests -p test_audit.py -v
      - run: python tests/test_bridge.py
      - run: python tests/test_release.py
      - run: python tests/test_external_upload.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run test:ui
