name: tests
on: [push, pull_request]
jobs:
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -X warn_default_encoding -W error::EncodingWarning app/sync_html_engine.py
      - name: Install and start through the local launcher
        run: python tests/test_launcher.py
        env:
          GAITSPM_TEST_BOOTSTRAP: '1'
      - run: python -m unittest discover -s tests -p test_audit.py -v
      - name: Direct spm1d concordance
        run: python tests/test_spm1d_validation.py
      - run: python tests/test_bridge.py
      - run: python tests/test_release.py
      - run: python tests/test_external_upload.py
      - run: python tests/test_package.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run test:ui
